name: Storefront integrity

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"
  push:
    branches: [main]
    paths:
      - "STOREFRONT_EVIDENCE_MANIFEST/**"
      - "netlify.toml"
      - "ops/check-commerce.sh"
      - ".github/workflows/storefront-integrity.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify public storefront and Gumroad checkout
        run: bash ops/check-commerce.sh

